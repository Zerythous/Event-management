# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks the syntax of the repository's JavaScript files.

name: JavaScript

on:
  push:
    branches: ["feature/eventora-platform"]
  pull_request:
    branches: ["feature/eventora-platform"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: git ls-files -z -- '*.js' | xargs -0 -r -n1 node --check
