<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover Events — Eventora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/design-system.css" />
  <link rel="stylesheet" href="styles/motion-3d.css" />
  <style>
    .ev-disc-hero {
      padding: 7.5rem 0 2.5rem;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(146, 169, 139, 0.22), transparent 65%),
        radial-gradient(ellipse 65% 50% at 90% 20%, rgba(24, 59, 42, 0.08), transparent 65%),
        var(--ev-cream);
      border-bottom: 1px solid var(--ev-border);
    }

    .ev-disc-controls {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .ev-filter-chips {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .ev-chip {
      border: 1px solid var(--ev-border-strong);
      background: var(--ev-white);
      color: var(--ev-body);
      border-radius: var(--ev-radius-pill);
      padding: 0.48rem 1rem;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 180ms ease;
    }
    .ev-chip:hover {
      border-color: var(--ev-forest);
      color: var(--ev-forest);
      transform: translateY(-1px);
    }
    .ev-chip.is-active {
      background: var(--ev-forest);
      border-color: var(--ev-forest);
      color: var(--ev-white);
      font-weight: 600;
    }

    .ev-select-bar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 720px) {
      .ev-select-bar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .ev-disc-main {
      padding: 2.75rem 0 5rem;
    }

    .ev-results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
      font-size: 0.875rem;
      color: var(--ev-muted);
    }

    .ev-events-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.6rem;
    }
    @media (min-width: 720px) { .ev-events-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1080px) { .ev-events-grid { grid-template-columns: repeat(3, 1fr); } }

    .ev-load-more-wrap {
      text-align: center;
      margin-top: 2.75rem;
    }
  </style>
</head>
<body>
  <div id="evNavMount"></div>

  <main>
    <section class="ev-disc-hero">
      <div class="ev-container">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;">
          <div>
            <span class="ev-section-kicker">Event Discovery</span>
            <h1 class="ev-section-title" style="margin-bottom:0.5rem;">Explore upcoming <span class="ev-accent">campus events</span></h1>
            <p class="ev-section-sub">
              Search hackathons, workshops, coding opens, and seminars across institutions.
              <span class="ev-badge ev-badge-sample" style="margin-left:0.35rem;">Sample Catalog</span>
            </p>
          </div>
          <button type="button" class="ev-btn ev-btn-outline ev-btn-sm" data-open-create="true" data-organizer-strict="true" hidden>+ Create Event</button>
        </div>

        <div class="ev-disc-controls">
          <!-- Search Bar -->
          <div class="ev-search-wrap">
            <span style="color:var(--ev-muted);display:inline-flex;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input
              type="search"
              id="evSearchInput"
              class="ev-search-input"
              placeholder="Search by event name, college, city, or organizer..."
              aria-label="Search events"
            />
            <button type="button" id="evClearSearchBtn" class="ev-btn ev-btn-forest ev-btn-sm">Search</button>
          </div>

          <!-- Category Filter Chips -->
          <div class="ev-filter-chips" id="evCategoryChips" role="group" aria-label="Category filters"></div>

          <!-- Multi-Facet Select Filters -->
          <div class="ev-select-bar">
            <div class="ev-field">
              <label class="ev-label" for="evFilterDate">Date Window</label>
              <select class="ev-select" id="evFilterDate">
                <option value="all">All Dates</option>
                <option value="this-week">This Week</option>
                <option value="this-month">This Month</option>
                <option value="upcoming">Upcoming</option>
              </select>
            </div>
            <div class="ev-field">
              <label class="ev-label" for="evFilterLocation">Location / Mode</label>
              <select class="ev-select" id="evFilterLocation">
                <option value="all">All Locations</option>
                <option value="Bengaluru">Bengaluru</option>
                <option value="Pune">Pune</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Chennai">Chennai</option>
                <option value="Online">Online / Hybrid</option>
              </select>
            </div>
            <div class="ev-field">
              <label class="ev-label" for="evFilterFormat">Participation</label>
              <select class="ev-select" id="evFilterFormat">
                <option value="all">All Formats</option>
                <option value="team">Team Supported</option>
                <option value="individual">Individual Only</option>
              </select>
            </div>
            <div class="ev-field">
              <label class="ev-label" for="evFilterSort">Sort By</label>
              <select class="ev-select" id="evFilterSort">
                <option value="date">Soonest Date</option>
                <option value="alpha">Alphabetical (A–Z)</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="ev-disc-main">
      <div class="ev-container">
        <div class="ev-results-meta">
          <div id="evResultsSummary">Loading sample catalog...</div>
          <button type="button" id="evResetFiltersBtn" class="ev-btn ev-btn-outline ev-btn-sm" style="display:none;">Reset Filters</button>
        </div>

        <div id="evCatalogContainer"></div>

        <div class="ev-load-more-wrap" id="evLoadMoreWrap" style="display:none;">
          <button type="button" id="evLoadMoreBtn" class="ev-btn ev-btn-outline">Load More Events</button>
        </div>
      </div>
    </section>
  </main>

  <div id="evFooterMount"></div>
  <div id="evModalsMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/events-store.js"></script>
  <script src="scripts/supabase-client.js"></script>
  <script src="scripts/profiles-api.js"></script>
  <script src="scripts/events-api.js"></script>
  <script src="scripts/rounds-api.js"></script>
  <script src="scripts/realtime-sync.js"></script>
  <script src="scripts/supabase-sync.js"></script>
  <script src="scripts/file-store.js"></script>
  <script src="scripts/auth-store.js"></script>
  <script src="scripts/role-access.js"></script>
  <script src="scripts/motion-3d.js"></script>
  <script src="scripts/components.js"></script>
  <script>
    (function initDiscoverPage() {
      EventoraUI.mountShell('discover');

      const params = new URLSearchParams(window.location.search);
      const state = {
        query: params.get('q') || '',
        category: params.get('category') || 'all',
        dateWindow: params.get('date') || 'all',
        location: params.get('location') || 'all',
        participation: params.get('format') || 'all',
        sort: 'date',
        visibleLimit: 6
      };

      const searchInput = document.getElementById('evSearchInput');
      const chipsMount = document.getElementById('evCategoryChips');
      const dateSel = document.getElementById('evFilterDate');
      const locSel = document.getElementById('evFilterLocation');
      const fmtSel = document.getElementById('evFilterFormat');
      const sortSel = document.getElementById('evFilterSort');
      const summaryEl = document.getElementById('evResultsSummary');
      const containerEl = document.getElementById('evCatalogContainer');
      const resetBtn = document.getElementById('evResetFiltersBtn');
      const loadMoreWrap = document.getElementById('evLoadMoreWrap');
      const loadMoreBtn = document.getElementById('evLoadMoreBtn');

      searchInput.value = state.query;
      dateSel.value = state.dateWindow;
      locSel.value = state.location;
      fmtSel.value = state.participation;

      function renderCategoryChips() {
        const cats = [{ slug: 'all', name: 'All Events' }, ...EventoraStore.getCategories()];
        chipsMount.innerHTML = cats.map((c) => `
          <button type="button" class="ev-chip ${state.category === c.slug ? 'is-active' : ''}" data-cat="${EventoraUI.escapeHTML(c.slug)}">
            ${EventoraUI.escapeHTML(c.name)}
          </button>
        `).join('');

        chipsMount.querySelectorAll('.ev-chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.category = btn.dataset.cat;
            state.visibleLimit = 6;
            syncUrl();
            renderCategoryChips();
            renderWithLoading();
          });
        });
      }

      function syncUrl() {
        const next = new URLSearchParams();
        if (state.query.trim()) next.set('q', state.query.trim());
        if (state.category !== 'all') next.set('category', state.category);
        if (state.dateWindow !== 'all') next.set('date', state.dateWindow);
        if (state.location !== 'all') next.set('location', state.location);
        if (state.participation !== 'all') next.set('format', state.participation);
        const qs = next.toString();
        const url = qs ? `discover.html?${qs}` : 'discover.html';
        window.history.replaceState(null, '', url);
      }

      function renderSkeletons() {
        containerEl.innerHTML = `
          <div class="ev-events-grid">
            ${[1, 2, 3].map(() => `
              <div class="ev-event-card" style="padding:1rem;">
                <div class="ev-skeleton" style="height:190px;margin-bottom:1rem;"></div>
                <div class="ev-skeleton" style="height:18px;width:65%;margin-bottom:0.6rem;"></div>
                <div class="ev-skeleton" style="height:14px;width:90%;margin-bottom:0.4rem;"></div>
                <div class="ev-skeleton" style="height:14px;width:55%;"></div>
              </div>
            `).join('')}
          </div>
        `;
      }

      let syncLoadError = '';
      let isCatalogLoading = false;

      function renderResults() {
        if (isCatalogLoading) {
          summaryEl.textContent = 'Loading event catalog...';
          renderSkeletons();
          return;
        }
        if (syncLoadError) {
          loadMoreWrap.style.display = 'none';
          summaryEl.textContent = 'Database connection issue';
          containerEl.innerHTML = window.EventoraSync.renderDatabaseErrorCardHTML({
            title: 'Failed to Load Public Events',
            message: syncLoadError,
            retryButtonId: 'evDiscoverRetryBtn'
          });
          document.getElementById('evDiscoverRetryBtn')?.addEventListener('click', loadPublicCatalogFromDb);
          return;
        }

        const matches = EventoraStore.filterEvents(state);
        const isDb = window.EventoraSync && window.EventoraSync.getStatus().mode === 'supabase';
        const hasFilters = state.query.trim() || state.category !== 'all' || state.dateWindow !== 'all' || state.location !== 'all' || state.participation !== 'all';
        resetBtn.style.display = hasFilters ? 'inline-flex' : 'none';

        summaryEl.innerHTML = `Showing ${Math.min(matches.length, state.visibleLimit)} of ${matches.length} ${isDb ? 'live database' : 'illustrative'} event${matches.length === 1 ? '' : 's'} ${window.EventoraSync ? window.EventoraSync.renderConnectionPillHTML() : ''}`;

        if (matches.length === 0) {
          loadMoreWrap.style.display = 'none';
          containerEl.innerHTML = `
            <div class="ev-empty-state">
              <div class="ev-empty-icon">${EventoraUI.icon('search')}</div>
              <h2 class="ev-display" style="font-size:1.45rem;font-weight:600;margin-bottom:0.45rem;">No matching events found</h2>
              <p style="font-size:0.92rem;color:var(--ev-muted);max-width:28rem;margin:0 auto 1.35rem;">
                ${isDb && !hasFilters ? 'No public events are published yet.' : 'Try broadening your search keywords or clearing one of the active category, location, or date filters.'}
              </p>
              ${hasFilters ? '<button type="button" class="ev-btn ev-btn-forest" id="evEmptyResetBtn">Reset All Filters</button>' : ''}
            </div>
          `;
          const emptyBtn = document.getElementById('evEmptyResetBtn');
          if (emptyBtn) emptyBtn.addEventListener('click', resetAllFilters);
          return;
        }

        const visible = matches.slice(0, state.visibleLimit);
        containerEl.innerHTML = `<div class="ev-events-grid">${visible.map(EventoraUI.renderEventCard).join('')}</div>`;
        loadMoreWrap.style.display = matches.length > state.visibleLimit ? 'block' : 'none';
        EventoraMotion.bindCardTilts(containerEl);
      }

      async function loadPublicCatalogFromDb() {
        if (!window.EventoraSync) return;
        syncLoadError = '';
        isCatalogLoading = true;
        renderResults();
        const res = await window.EventoraSync.hydratePublicCatalog({});
        isCatalogLoading = false;
        if (res && !res.ok && res.mode === 'supabase') {
          syncLoadError = res.error || 'Could not reach Supabase database.';
        } else if (res && res.ok && res.mode === 'supabase' && window.EventoraRealtime) {
          window.EventoraRealtime.subscribePublicCatalog({
            scopeKey: 'discover-public-catalog',
            onChange: async () => {
              await window.EventoraSync.hydratePublicCatalog({});
              renderResults();
            }
          });
        }
        renderResults();
      }

      let loadTimer = null;
      function renderWithLoading() {
        clearTimeout(loadTimer);
        renderSkeletons();
        loadTimer = setTimeout(renderResults, 140);
      }

      function resetAllFilters() {
        state.query = '';
        state.category = 'all';
        state.dateWindow = 'all';
        state.location = 'all';
        state.participation = 'all';
        state.visibleLimit = 6;
        searchInput.value = '';
        dateSel.value = 'all';
        locSel.value = 'all';
        fmtSel.value = 'all';
        syncUrl();
        renderCategoryChips();
        renderWithLoading();
      }

      searchInput.addEventListener('input', () => {
        state.query = searchInput.value;
        syncUrl();
        renderResults();
      });
      document.getElementById('evClearSearchBtn').addEventListener('click', () => {
        state.query = searchInput.value;
        syncUrl();
        renderWithLoading();
      });
      dateSel.addEventListener('change', () => { state.dateWindow = dateSel.value; syncUrl(); renderWithLoading(); });
      locSel.addEventListener('change', () => { state.location = locSel.value; syncUrl(); renderWithLoading(); });
      fmtSel.addEventListener('change', () => { state.participation = fmtSel.value; syncUrl(); renderWithLoading(); });
      sortSel.addEventListener('change', () => { state.sort = sortSel.value; renderWithLoading(); });
      resetBtn.addEventListener('click', resetAllFilters);
      loadMoreBtn.addEventListener('click', () => { state.visibleLimit += 6; renderResults(); });

      renderCategoryChips();
      renderResults();
      loadPublicCatalogFromDb();
      window.addEventListener('eventora:authchange', renderResults);
      EventoraMotion.initAll();
    })();
  </script>
</body>
</html>
