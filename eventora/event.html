<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Details — Eventora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/design-system.css" />
  <link rel="stylesheet" href="styles/motion-3d.css" />
  <style>
    .ev-detail-controls {
      padding-top: 5.5rem;
      padding-bottom: 0.95rem;
      border-bottom: 1px solid var(--ev-border);
      background: var(--ev-white);
    }
    @media (min-width: 768px) {
      .ev-detail-controls { padding-top: 6rem; }
    }
    .ev-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      flex-wrap: wrap;
      font-size: 0.84rem;
    }
    .ev-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      color: var(--ev-forest);
      padding: 0.35rem 0.75rem 0.35rem 0.4rem;
      border-radius: var(--ev-radius-pill);
      transition: background-color 160ms ease, color 160ms ease;
    }
    .ev-back-link:hover {
      background: var(--ev-sage-tint);
      color: var(--ev-forest-hover);
    }

    .ev-event-hero {
      position: relative;
      min-height: 430px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: var(--ev-forest);
      color: var(--ev-white);
    }
    .ev-event-hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .ev-event-hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
    }
    .ev-event-hero-bg .ev-poster-fallback {
      position: absolute;
      inset: 0;
    }
    .ev-event-hero-veil {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .ev-event-hero-content {
      position: relative;
      z-index: 4;
      width: 100%;
      padding: 3rem 0;
    }
    @media (min-width: 960px) {
      .ev-event-hero-content { padding: 3.75rem 0; }
    }
    .ev-event-hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: center;
    }
    @media (min-width: 960px) {
      .ev-event-hero-grid { grid-template-columns: minmax(0, 1.38fr) minmax(300px, 385px); gap: 2.75rem; }
    }

    .ev-hero-meta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem 1.5rem;
      margin-top: 1.5rem;
      padding-top: 1.35rem;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    @media (min-width: 560px) {
      .ev-hero-meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .ev-hero-meta-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      min-width: 0;
    }
    .ev-hero-meta-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .ev-hero-meta-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(246, 245, 239, 0.68);
    }
    .ev-hero-meta-val {
      font-size: 0.88rem;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 1.35;
      overflow-wrap: break-word;
    }

    .ev-hero-card-box {
      background: rgba(246, 245, 239, 0.96);
      color: var(--ev-charcoal);
      border-radius: var(--ev-radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.85);
      padding: 1.6rem;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.28);
    }
    .ev-reg-specs {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin: 1rem 0 1.25rem;
      padding: 0.85rem 0;
      border-top: 1px solid var(--ev-border);
      border-bottom: 1px solid var(--ev-border);
      font-size: 0.82rem;
    }
    .ev-reg-spec-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .ev-event-nav-bar {
      background: var(--ev-white);
      border-bottom: 1px solid var(--ev-border);
      position: sticky;
      top: 66px;
      z-index: 40;
      box-shadow: 0 4px 16px rgba(24, 59, 42, 0.04);
    }
    @media (min-width: 1024px) {
      .ev-event-nav-bar { top: 72px; }
    }

    .ev-event-main {
      padding: 2.75rem 0 6rem;
      min-height: 460px;
    }
    .ev-detail-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (min-width: 960px) {
      .ev-detail-layout {
        grid-template-columns: minmax(0, 1.58fr) minmax(290px, 0.82fr);
      }
    }
    .ev-detail-layout > * { min-width: 0; }

    .ev-panel-stack {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .ev-panel-card {
      background: var(--ev-white);
      border: 1px solid var(--ev-border);
      border-radius: var(--ev-radius-lg);
      padding: 1.85rem;
      box-shadow: var(--ev-shadow-sm);
    }

    .ev-overview-glance {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--ev-border);
    }
    @media (min-width: 540px) {
      .ev-overview-glance { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .ev-glance-tile {
      padding: 1rem 1.1rem;
      background: var(--ev-cream);
      border: 1px solid var(--ev-border);
      border-radius: var(--ev-radius-md);
    }
    .ev-glance-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ev-muted);
    }
    .ev-glance-value {
      font-weight: 600;
      font-size: 0.94rem;
      color: var(--ev-charcoal);
      margin-top: 0.25rem;
      overflow-wrap: break-word;
    }

    .ev-detail-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    @media (min-width: 960px) {
      .ev-detail-sidebar {
        position: sticky;
        top: 132px;
      }
    }
    .ev-sidebar-card {
      background: var(--ev-white);
      border: 1px solid var(--ev-border);
      border-radius: var(--ev-radius-lg);
      padding: 1.5rem;
      box-shadow: var(--ev-shadow-sm);
    }
    .ev-sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.9rem;
    }
    .ev-sidebar-row {
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--ev-border);
    }
    .ev-sidebar-row:last-child { border-bottom: none; padding-bottom: 0; }

    .ev-timeline-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--ev-border);
    }
    @media (min-width: 640px) {
      .ev-timeline-item { grid-template-columns: 200px 1fr; gap: 1.5rem; }
    }
    .ev-timeline-item:last-child { border-bottom: none; padding-bottom: 0; }

    .ev-round-item {
      padding: 1.5rem;
      background: var(--ev-white);
      border: 1px solid var(--ev-border);
      border-radius: var(--ev-radius-md);
      margin-bottom: 1rem;
    }
    .ev-round-item:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div id="evNavMount"></div>

  <main>
    <!-- Header Sub-Row: Back to Discover + Conditional Preview Controls -->
    <div class="ev-detail-controls">
      <div class="ev-container ev-controls-row">
        <a href="discover.html" class="ev-back-link">
          &larr; Back to Discover
        </a>
        <div id="evEventControlsRight" style="display:flex;align-items:center;gap:0.65rem;flex-wrap:wrap;min-width:0;max-width:100%;"></div>
      </div>
    </div>

    <div id="evDynamicEventMount"></div>
  </main>

  <div id="evFooterMount"></div>
  <div id="evModalsMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/events-store.js"></script>
  <script src="scripts/supabase-client.js"></script>
  <script src="scripts/profiles-api.js"></script>
  <script src="scripts/events-api.js"></script>
  <script src="scripts/collaborators-api.js"></script>
  <script src="scripts/rounds-api.js"></script>
  <script src="scripts/registrations-api.js"></script>
  <script src="scripts/teams-api.js"></script>
  <script src="scripts/round-content-api.js"></script>
  <script src="scripts/submissions-api.js"></script>
  <script src="scripts/evaluations-api.js"></script>
  <script src="scripts/qualification-api.js"></script>
  <script src="scripts/leaderboard-api.js"></script>
  <script src="scripts/announcements-api.js"></script>
  <script src="scripts/realtime-sync.js"></script>
  <script src="scripts/supabase-sync.js"></script>
  <script src="scripts/file-store.js"></script>
  <script src="scripts/auth-store.js"></script>
  <script src="scripts/role-access.js"></script>
  <script src="scripts/motion-3d.js"></script>
  <script src="scripts/components.js"></script>
  <script>
    (async function initDynamicEventPage() {
      EventoraUI.mountShell('event');

      const params = new URLSearchParams(window.location.search);
      const requestedSlug = params.get('slug');
      const isShowcaseMode = !requestedSlug || params.get('preview') === '1' || params.get('showcase') === '1';
      const mount = document.getElementById('evDynamicEventMount');
      const rightControls = document.getElementById('evEventControlsRight');

      if (window.EventoraAuth && typeof window.EventoraAuth.ready === 'function') {
        await window.EventoraAuth.ready();
      }
      const initialUser = window.EventoraAuth && typeof window.EventoraAuth.getSession === 'function'
        ? window.EventoraAuth.getSession()
        : null;

      if (window.EventoraSync && mount) {
        if (requestedSlug) {
          mount.innerHTML = `<section style="padding:3rem 0;"><div class="ev-container">${window.EventoraSync.renderLoadingCardHTML('Loading event workspace & live schedule...')}</div></section>`;
        }
        const backendState = await window.EventoraSync.initBackend();
        if (backendState.mode === 'supabase') {
          if (requestedSlug) {
            const hRes = await window.EventoraSync.hydrateEventBySlug(requestedSlug, initialUser, { organizerView: false });
            if (!hRes.ok) {
              mount.innerHTML = `<section style="padding:3rem 0;"><div class="ev-container">${window.EventoraSync.renderDatabaseErrorCardHTML({ title: 'Unable to Load Event', message: hRes.error, retryButtonId: 'evPublicEventRetryBtn' })}</div></section>`;
              document.getElementById('evPublicEventRetryBtn')?.addEventListener('click', () => window.location.reload());
              return;
            }
          } else {
            await window.EventoraSync.hydratePublicCatalog({});
          }
        }
      }

      function renderDynamicEventView() {
        const allEvents = EventoraStore.getAllEvents();
        const ev = requestedSlug ? EventoraStore.getEventBySlug(requestedSlug) : allEvents[0];
        const isDbMode = window.EventoraSync && window.EventoraSync.getStatus().mode === 'supabase';

        if (rightControls && ev) {
          if (isShowcaseMode) {
            rightControls.innerHTML = `
              <label for="evDynamicSwitch" style="color:var(--ev-muted);font-weight:500;">Switch Preview Event:</label>
              <select id="evDynamicSwitch" class="ev-select" style="width:min(100%, 340px);max-width:100%;min-width:0;padding:0.38rem 0.75rem;font-size:0.82rem;"></select>
            `;
            const switchSel = document.getElementById('evDynamicSwitch');
            switchSel.innerHTML = allEvents.map((item) => `
              <option value="${EventoraUI.escapeHTML(item.slug)}" ${item.slug === ev.slug ? 'selected' : ''}>
                ${EventoraUI.escapeHTML(item.name)} (${item.rounds.length} round${item.rounds.length === 1 ? '' : 's'})
              </option>
            `).join('');
            switchSel.addEventListener('change', () => {
              window.location.href = `event.html?slug=${encodeURIComponent(switchSel.value)}&preview=1`;
            });
          } else if (isDbMode) {
            rightControls.innerHTML = `
              ${window.EventoraSync.renderConnectionPillHTML()}
              <button type="button" class="ev-btn ev-btn-outline ev-btn-sm" data-open-create="true" data-organizer-strict="true" hidden>+ Create Event</button>
            `;
          } else if (ev.isCreatedEvent) {
            rightControls.innerHTML = `
              <span class="ev-badge ev-badge-open">Local Preview Draft</span>
              <button type="button" class="ev-btn ev-btn-outline ev-btn-sm" data-open-create="true" data-organizer-strict="true" hidden>+ Create Another</button>
            `;
          } else {
            rightControls.innerHTML = `
              <span style="color:var(--ev-muted);font-size:0.8rem;">${EventoraUI.escapeHTML(ev.institutionShort || ev.institution)} &bull; ${EventoraUI.escapeHTML(ev.mode)}</span>
            `;
          }
        }

        if (!ev) {
          mount.innerHTML = `
            <section style="padding:5rem 0;">
              <div class="ev-container">
                <div class="ev-empty-state">
                  <div class="ev-empty-icon">${EventoraUI.icon('compass')}</div>
                  <h1 class="ev-display" style="font-size:1.8rem;font-weight:600;margin-bottom:0.5rem;">Event Not Found</h1>
                  <p style="font-size:0.95rem;color:var(--ev-muted);max-width:28rem;margin:0 auto 1.5rem;">
                    No event matches the requested identifier. Explore configured events in Discovery.
                  </p>
                  <a href="discover.html" class="ev-btn ev-btn-forest">Browse Discovery Catalog</a>
                </div>
              </div>
            </section>
          `;
          return null;
        }
        return ev;
      }

      const ev = renderDynamicEventView();
      if (!ev) return;

      const allEvents = EventoraStore.getAllEvents();

      document.title = `${ev.name} — Eventora`;
      const esc = EventoraUI.escapeHTML;
      const accent = ev.accentColor || '#183B2A';

      const roundsList = (Array.isArray(ev.rounds) ? ev.rounds : []).filter((r) => r.enabled !== false);
      const scheduleList = Array.isArray(ev.schedule) ? ev.schedule : [];
      const rulesList = Array.isArray(ev.rules) ? ev.rules : [];
      const organizersList = Array.isArray(ev.organizers) ? ev.organizers : [];
      const faqsList = Array.isArray(ev.faqs) ? ev.faqs : [];
      const teamSupported = Boolean(ev.teamConfig && ev.teamConfig.supported);
      const publishedResults = EventoraStore.getPublishedEventResults ? EventoraStore.getPublishedEventResults(ev, null) : null;
      const hasAnyPublishedResults = Boolean(
        publishedResults && (publishedResults.overallPublished || (publishedResults.publishedRounds || []).some((pr) => pr.published || pr.leaderboardPublished))
      );

      // Dynamically determine applicable tabs based on event config
      const tabs = [
        { id: 'overview', label: 'Overview', show: true },
        { id: 'schedule', label: 'Schedule', show: scheduleList.length > 0 },
        { id: 'rounds', label: `Rounds (${roundsList.length})`, show: roundsList.length > 0 },
        { id: 'leaderboard', label: 'Results & Leaderboard', show: hasAnyPublishedResults },
        { id: 'rules', label: 'Rules', show: rulesList.length > 0 },
        { id: 'teams', label: 'Teams', show: teamSupported },
        { id: 'organizers', label: 'Organizers', show: organizersList.length > 0 },
        { id: 'faqs', label: 'FAQs', show: faqsList.length > 0 }
      ].filter((t) => t.show);

      mount.innerHTML = `
        <!-- B. Dynamic Event Hero -->
        <section class="ev-event-hero ev-hero-scene" id="evEventHeroStage">
          <div class="ev-event-hero-bg">
            ${ev.coverImage ? `<img src="${esc(ev.coverImage)}" alt="${esc(ev.name)} cover image" class="ev-parallax-bg" data-ev-poster-img="true" />` : ''}
            <div class="ev-poster-fallback" ${ev.coverImage ? 'hidden' : ''}>
              <span class="ev-poster-fallback-icon">${EventoraUI.icon('sparkles')}</span>
              <span class="ev-poster-fallback-sub">${esc(ev.categoryLabel)}</span>
            </div>
          </div>
          <div class="ev-event-hero-veil" style="background: linear-gradient(105deg, rgba(17,44,31,0.92) 0%, rgba(24,59,42,0.78) 54%, ${esc(accent)}cc 100%);"></div>

          <div class="ev-event-hero-content">
            <div class="ev-container ev-event-hero-grid">
              <div class="ev-parallax-mid" style="min-width:0;">
                <div style="display:flex;align-items:center;gap:0.55rem;flex-wrap:wrap;margin-bottom:1.1rem;">
                  <span class="ev-badge ev-badge-category">${esc(ev.categoryLabel)}</span>
                  <span class="ev-badge" style="background:rgba(255,255,255,0.18);color:#FFFFFF;border:1px solid rgba(255,255,255,0.3);">${esc(ev.eventStatus)}</span>
                  ${ev.isPreviewDraft ? '<span class="ev-badge" style="background:rgba(146,169,139,0.28);color:#FFFFFF;border:1px solid rgba(255,255,255,0.26);">Frontend Preview Draft</span>' : ''}
                </div>

                <h1 class="ev-display" style="font-size:clamp(2rem,3.8vw,3.15rem);font-weight:600;color:#FFFFFF;line-height:1.08;margin-bottom:0.85rem;overflow-wrap:break-word;">
                  ${esc(ev.name)}
                </h1>
                <p style="font-size:1.02rem;color:rgba(246,245,239,0.9);max-width:40rem;line-height:1.6;">
                  ${esc(ev.tagline)}
                </p>

                <!-- Structured 2x2 Event Details Grid -->
                <div class="ev-hero-meta-grid">
                  <div class="ev-hero-meta-item">
                    <span class="ev-hero-meta-icon">${EventoraUI.icon('calendar')}</span>
                    <div>
                      <div class="ev-hero-meta-label">Date</div>
                      <div class="ev-hero-meta-val">${esc(ev.dateLabel)}</div>
                    </div>
                  </div>
                  <div class="ev-hero-meta-item">
                    <span class="ev-hero-meta-icon">${EventoraUI.icon('mapPin')}</span>
                    <div>
                      <div class="ev-hero-meta-label">Location</div>
                      <div class="ev-hero-meta-val">${esc(ev.location)}</div>
                    </div>
                  </div>
                  <div class="ev-hero-meta-item">
                    <span class="ev-hero-meta-icon">${EventoraUI.icon('compass')}</span>
                    <div>
                      <div class="ev-hero-meta-label">Institution</div>
                      <div class="ev-hero-meta-val">${esc(ev.institution)}</div>
                    </div>
                  </div>
                  <div class="ev-hero-meta-item">
                    <span class="ev-hero-meta-icon">${EventoraUI.icon('users')}</span>
                    <div>
                      <div class="ev-hero-meta-label">Organizer</div>
                      <div class="ev-hero-meta-val">${esc(ev.organizer)}</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- C. Dynamic Adaptive Registration Card -->
              <div class="ev-3d-stage ev-parallax-fore">
                <div class="ev-3d-card ev-hero-card-box" id="evHeroRegCardMount"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- D. Event Navigation Tabs -->
        <nav class="ev-event-nav-bar" aria-label="Event Sections">
          <div class="ev-container">
            <div class="ev-tabs" id="evDetailTabs">
              ${tabs.map((t, idx) => `
                <button type="button" class="ev-tab-btn ${idx === 0 ? 'is-active' : ''}" data-ev-tab="${esc(t.id)}">${esc(t.label)}</button>
              `).join('')}
            </div>
          </div>
        </nav>

        <!-- E. Balanced Two-Column Dynamic Content Area -->
        <section class="ev-event-main">
          <div class="ev-container ev-detail-layout">
            <div style="min-width:0;">
              <!-- Overview Tab -->
              <div class="ev-tab-panel is-active" id="tab-overview">
                <div class="ev-panel-stack">
                  <div class="ev-panel-card">
                    <span class="ev-section-kicker">About This Event</span>
                    <h2 class="ev-display" style="font-size:1.65rem;font-weight:600;margin-bottom:0.9rem;">Event Overview</h2>
                    <p style="font-size:0.98rem;color:var(--ev-body);line-height:1.72;max-width:66ch;margin-bottom:1.6rem;">
                      ${esc(ev.description)}
                    </p>
                    <div class="ev-overview-glance">
                      <div class="ev-glance-tile">
                        <div class="ev-glance-label">Host Institution</div>
                        <div class="ev-glance-value">${esc(ev.institution)}</div>
                      </div>
                      <div class="ev-glance-tile">
                        <div class="ev-glance-label">Organized By</div>
                        <div class="ev-glance-value">${esc(ev.organizer)}</div>
                      </div>
                      <div class="ev-glance-tile">
                        <div class="ev-glance-label">Format &amp; Mode</div>
                        <div class="ev-glance-value">${esc(ev.teamConfig.label)} &bull; ${esc(ev.mode)}</div>
                      </div>
                      <div class="ev-glance-tile">
                        <div class="ev-glance-label">Stage Structure</div>
                        <div class="ev-glance-value">${roundsList.length > 0 ? `${roundsList.length} Configured Round${roundsList.length > 1 ? 's' : ''}` : 'Single-Session Seminar'}</div>
                      </div>
                    </div>
                  </div>

                  ${roundsList.length > 0 ? `
                    <div class="ev-panel-card">
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem;">
                        <div>
                          <h3 class="ev-display" style="font-size:1.25rem;font-weight:600;">Configured Event Rounds</h3>
                          <p style="font-size:0.85rem;color:var(--ev-muted);">Overview of competitive or workshop milestones.</p>
                        </div>
                        <button type="button" class="ev-btn ev-btn-outline ev-btn-sm" data-ev-jump-tab="rounds">View All ${roundsList.length} Rounds &rarr;</button>
                      </div>
                      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.85rem;">
                        ${roundsList.map((r) => `
                          <div style="padding:1rem;background:var(--ev-cream);border:1px solid var(--ev-border);border-radius:var(--ev-radius-md);">
                            <span style="font-size:0.7rem;font-weight:700;color:var(--ev-primary);text-transform:uppercase;letter-spacing:0.06em;">Round ${esc(r.order)} &bull; ${esc(r.duration)}</span>
                            <div style="font-weight:600;color:var(--ev-charcoal);margin-top:0.2rem;">${esc(r.name)}</div>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}

                  ${scheduleList.length > 0 ? `
                    <div class="ev-panel-card">
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:0.85rem;">
                        <div>

                          <div class="ev-timeline-item">
                            <div style="font-weight:600;font-size:0.86rem;color:var(--ev-forest);">${esc(item.time)}</div>

                              <div style="font-weight:600;color:var(--ev-charcoal);margin-bottom:0.15rem;">${esc(item.title)}</div>
                              <div style="font-size:0.86rem;color:var(--ev-muted);">${esc(item.detail)}</div>
                            </div>
                          </div>
                        `).join('')}
                      </div>

              <!-- Schedule Tab -->
              ${scheduleList.length > 0 ? `
                <div class="ev-tab-panel" id="tab-schedule">
                  <div class="ev-panel-card">
                    <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;margin-bottom:0.5rem;">Configured Schedule</h2>

                      ${scheduleList.map((item) => `
                        <div class="ev-timeline-item">
                          <div style="font-weight:600;font-size:0.88rem;color:var(--ev-forest);">${esc(item.time)}</div>
                          <div>
                            <div style="font-weight:600;color:var(--ev-charcoal);margin-bottom:0.2rem;">${esc(item.title)}</div>

                        </div>

                  </div>

              <!-- Dynamic Rounds Tab -->
              ${roundsList.length > 0 ? `
                <div class="ev-tab-panel" id="tab-rounds">
                  <div style="margin-bottom:1.25rem;">
                    <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;">Event Rounds (${roundsList.length})</h2>

                  ${roundsList.map((r) => {
                    const highlights = window.EventoraStore && typeof window.EventoraStore.getRoundHighlights === 'function'
                      ? window.EventoraStore.getRoundHighlights(r)

                    return `
                      <div class="ev-3d-stage" style="margin-bottom:1rem;">
                        <div class="ev-3d-card ev-round-item">
                          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:0.65rem;">
                            <div>
                              <span style="font-size:0.75rem;font-weight:700;color:var(--ev-primary);text-transform:uppercase;letter-spacing:0.06em;">Round ${esc(r.order)} &bull; ${esc(r.typeLabel || r.type)}</span>
                              <h3 class="ev-display" style="font-size:1.25rem;font-weight:600;margin-top:0.15rem;">${esc(r.name)}</h3>
                            </div>
                            <span class="ev-badge ev-badge-open">${esc(r.status || 'Scheduled')}</span>
                          </div>
                          ${r.description ? `<p style="font-size:0.88rem;color:var(--ev-muted);margin-bottom:0.55rem;">${esc(r.description)}</p>` : ''}
                          ${r.instructions ? `<p style="font-size:0.9rem;color:var(--ev-body);margin-bottom:0.85rem;">${esc(r.instructions)}</p>` : ''}
                          ${highlights.length > 0 ? `
                            <div class="ev-rb-chip-row" style="margin-bottom:0.85rem;">
                              ${highlights.map((chip) => `<span class="ev-rb-chip">${esc(chip)}</span>`).join('')}
                            </div>
                          ` : ''}
                          <div style="display:flex;flex-wrap:wrap;gap:1.15rem;font-size:0.8rem;color:var(--ev-muted);padding-top:0.75rem;border-top:1px solid var(--ev-border);">
                            <span style="display:inline-flex;align-items:center;gap:0.35rem;">${EventoraUI.icon('clock')} Duration: <strong style="color:var(--ev-charcoal);">${esc(r.duration || 'TBD')}</strong></span>
                            <span style="display:inline-flex;align-items:center;gap:0.35rem;">${EventoraUI.icon('users')} Eligibility: <strong style="color:var(--ev-charcoal);">${esc(r.eligibility || 'Open to all participants')}</strong></span>
                            <span style="display:inline-flex;align-items:center;gap:0.35rem;">${EventoraUI.icon('calendar')} Timeline: <strong style="color:var(--ev-charcoal);">${esc(r.startTime || 'TBD')}</strong></span>
                            ${r.venueOrOnline ? `<span>Venue / Link: <strong style="color:var(--ev-charcoal);">${esc(r.venueOrOnline)}</strong></span>` : ''}
                            ${r.maxParticipants ? `<span>Capacity: <strong style="color:var(--ev-charcoal);">Max ${esc(r.maxParticipants)}</strong></span>` : ''}
                            ${r.scoring && r.scoring.enabled ? `<span>Points: <strong style="color:var(--ev-charcoal);">Max ${esc(r.scoring.maxScore)} ${esc(r.scoring.pointsLabel || 'pts')}</strong></span>` : ''}
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}

              <!-- Rules Tab -->
              ${rulesList.length > 0 ? `
                <div class="ev-tab-panel" id="tab-rules">
                  <div class="ev-panel-card">
                    <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;margin-bottom:1rem;">Rules &amp; Guidelines</h2>
                    <ul style="list-style:none;display:flex;flex-direction:column;gap:0.85rem;">
                      ${rulesList.map((rule, idx) => `
                        <li style="display:flex;gap:0.75rem;align-items:flex-start;font-size:0.93rem;color:var(--ev-body);">
                          <span style="width:24px;height:24px;border-radius:9999px;background:var(--ev-sage-tint);color:var(--ev-forest);display:inline-flex;align-items:center;justify-content:center;font-size:0.76rem;font-weight:700;flex-shrink:0;">${idx + 1}</span>
                          <span>${esc(rule)}</span>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                </div>
              ` : ''}

              <!-- Teams Tab -->
              ${teamSupported ? `
                <div class="ev-tab-panel" id="tab-teams">
                  <div class="ev-panel-card">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
                      <div>
                        <span class="ev-badge ev-badge-open" style="margin-bottom:0.4rem;">Team Rules &amp; Availability</span>
                        <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;">Team Participation</h2>
                        <p style="font-size:0.88rem;color:var(--ev-muted);">
                          This event uses <strong>${esc(ev.teamConfig.minSize)}–${esc(ev.teamConfig.maxSize)}</strong> member squads (${ev.teamConfig.creationMode === 'organizer_only' ? 'Organizer-managed teams' : 'Participant team formation enabled'}).
                        </p>
                      </div>
                      <a href="register.html?slug=${encodeURIComponent(ev.slug)}" class="ev-btn ev-btn-forest ev-btn-sm">Open Registration Flow &rarr;</a>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.85rem;margin-bottom:1rem;">
                      <div style="padding:0.9rem;border-radius:var(--ev-radius-sm);background:var(--ev-cream);border:1px solid var(--ev-border);">
                        <div class="ev-glance-label">Creation Policy</div>
                        <div style="font-weight:600;color:var(--ev-charcoal);font-size:0.88rem;margin-top:0.2rem;">${ev.teamConfig.creationMode === 'organizer_only' ? 'Organizer-only assignment' : 'Participants may create teams'}</div>
                      </div>
                      <div style="padding:0.9rem;border-radius:var(--ev-radius-sm);background:var(--ev-cream);border:1px solid var(--ev-border);">
                        <div class="ev-glance-label">Membership Policy</div>
                        <div style="font-weight:600;color:var(--ev-charcoal);font-size:0.88rem;margin-top:0.2rem;">${ev.teamConfig.exclusiveMembership ? 'Exclusive (1 team per user)' : 'Multi-team allowed'} &bull; ${ev.teamConfig.requireLeader ? 'Leader required' : 'Leader optional'}</div>
                      </div>
                      <div style="padding:0.9rem;border-radius:var(--ev-radius-sm);background:var(--ev-cream);border:1px solid var(--ev-border);">
                        <div class="ev-glance-label">Open Teams Currently</div>
                        <div style="font-weight:600;color:var(--ev-charcoal);font-size:0.88rem;margin-top:0.2rem;">${(ev.teams || []).filter((t) => t.memberIds.length < t.maxTeamSize).length} open of ${(ev.teams || []).length} team(s)</div>
                      </div>
                    </div>
                    <p style="font-size:0.84rem;color:var(--ev-muted);">
                      Sign in and proceed through Step 3 of the Registration Flow to create a team, join an existing open squad, or manage teams in your Participant Dashboard.
                    </p>
                  </div>
                </div>
              ` : ''}

              <!-- Organizers Tab -->
              ${organizersList.length > 0 ? `
                <div class="ev-tab-panel" id="tab-organizers">
                  <div class="ev-panel-card">
                    <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;margin-bottom:1.15rem;">Organizers &amp; Managers</h2>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;">
                      ${organizersList.map((o) => `
                        <div style="padding:1.15rem;border-radius:var(--ev-radius-md);border:1px solid var(--ev-border);background:var(--ev-cream);">
                          <div style="font-weight:600;color:var(--ev-charcoal);margin-bottom:0.2rem;">${esc(o.name)}</div>
                          <div style="font-size:0.82rem;font-weight:600;color:var(--ev-primary);">${esc(o.role)}</div>
                          <div style="font-size:0.78rem;color:var(--ev-muted);margin-top:0.2rem;">${esc(o.department)}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              ` : ''}

              <!-- FAQs Tab -->
              ${faqsList.length > 0 ? `
                <div class="ev-tab-panel" id="tab-faqs">
                  <div class="ev-panel-card">
                    <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;margin-bottom:1rem;">Frequently Asked Questions</h2>
                    <div style="display:flex;flex-direction:column;gap:0.9rem;">
                      ${faqsList.map((f) => `
                        <div style="padding:1rem 1.15rem;border-radius:var(--ev-radius-md);background:var(--ev-cream);border:1px solid var(--ev-border);">
                          <div style="font-weight:600;color:var(--ev-charcoal);margin-bottom:0.35rem;">${esc(f.q)}</div>
                          <div style="font-size:0.88rem;color:var(--ev-muted);">${esc(f.a)}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              ` : ''}

              <!-- Published Leaderboard & Results Tab -->
              ${hasAnyPublishedResults && publishedResults ? `
                <div class="ev-tab-panel" id="tab-leaderboard">
                  <div class="ev-panel-card">
                    <span class="ev-badge ev-badge-open" style="margin-bottom:0.45rem;">Published Event Results</span>
                    <h2 class="ev-display" style="font-size:1.55rem;font-weight:600;margin-bottom:0.75rem;">Official Standings &amp; Leaderboard</h2>
                    ${publishedResults.overallPublished ? `
                      <div style="margin-bottom:1.25rem;">
                        <h3 class="ev-display" style="font-size:1.15rem;font-weight:600;margin-bottom:0.5rem;">Overall Leaderboard</h3>
                        <div class="ev-lc-table-wrap">
                          <table class="ev-lc-table" style="min-width:440px;">
                            <thead><tr><th>Rank</th><th>Participant / Team</th><th>Overall Score</th><th>%</th><th>Qualification</th></tr></thead>
                            <tbody>
                              ${publishedResults.overallEntries.map((row) => `
                                <tr>
                                  <td><strong>#${row.rank}${row.isTied ? ' (Tied)' : ''}</strong></td>
                                  <td><strong>${esc(row.name)}</strong></td>
                                  <td>${row.overallScore} / ${row.overallMax}</td>
                                  <td>${row.overallPercentage}%</td>
                                  <td>${row.qualified ? '<span class="ev-lc-badge ev-lc-badge-live">Qualified</span>' : '<span class="ev-lc-pill">Ranked</span>'}</td>
                                </tr>
                              `).join('')}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    ` : ''}
                    ${publishedResults.publishedRounds.filter((pr) => pr.published || pr.leaderboardPublished).map((pr) => `
                      <div style="margin-bottom:1.1rem;">
                        <h3 class="ev-display" style="font-size:1.1rem;font-weight:600;margin-bottom:0.45rem;">Round ${pr.roundOrder}: ${esc(pr.roundName)}</h3>
                        <div class="ev-lc-table-wrap">
                          <table class="ev-lc-table" style="min-width:440px;">
                            <thead><tr><th>Rank</th><th>Participant / Team</th><th>Score</th><th>%</th><th>Status</th></tr></thead>
                            <tbody>
                              ${pr.entries.map((row) => `
                                <tr>
                                  <td><strong>#${row.rank}${row.isTied ? ' (Tied)' : ''}</strong></td>
                                  <td><strong>${esc(row.name)}</strong></td>
                                  <td>${row.awardedMarks} / ${row.maxMarks}</td>
                                  <td>${row.percentage}%</td>
                                  <td>${row.qualified ? '<span class="ev-lc-badge ev-lc-badge-live">Qualified</span>' : '<span class="ev-lc-pill">Evaluated</span>'}</td>
                                </tr>
                              `).join('')}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Contextual Sidebar Column (Connects Event Logistics Without Disconnected Cards) -->
            <aside class="ev-detail-sidebar" aria-label="Event summary sidebar">
              <div class="ev-sidebar-card">
                <div style="font-family:var(--ev-font-display);font-size:1.08rem;font-weight:600;color:var(--ev-charcoal);">Event Logistics</div>
                <div class="ev-sidebar-list">
                  <div class="ev-sidebar-row">
                    <div class="ev-glance-label">Date Window</div>
                    <div style="font-size:0.88rem;font-weight:600;color:var(--ev-charcoal);margin-top:0.15rem;">${esc(ev.dateLabel)}</div>
                  </div>
                  <div class="ev-sidebar-row">
                    <div class="ev-glance-label">Venue &amp; Mode</div>
                    <div style="font-size:0.88rem;font-weight:600;color:var(--ev-charcoal);margin-top:0.15rem;">${esc(ev.location)} (${esc(ev.mode)})</div>
                  </div>
                  <div class="ev-sidebar-row">
                    <div class="ev-glance-label">Organizer &amp; Host</div>
                    <div style="font-size:0.88rem;font-weight:600;color:var(--ev-charcoal);margin-top:0.15rem;">${esc(ev.organizer)}</div>
                    <div style="font-size:0.78rem;color:var(--ev-muted);">${esc(ev.institution)}</div>
                  </div>
                  <div class="ev-sidebar-row">
                    <div class="ev-glance-label">Participation</div>
                    <div style="font-size:0.88rem;font-weight:600;color:var(--ev-charcoal);margin-top:0.15rem;">${esc(ev.teamConfig.label)}</div>
                  </div>
                </div>
              </div>

              ${organizersList.length > 0 ? `
                <div class="ev-sidebar-card">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.85rem;">
                    <div style="font-family:var(--ev-font-display);font-size:1.05rem;font-weight:600;color:var(--ev-charcoal);">Organizing Team</div>
                    <button type="button" class="ev-back-link" style="font-size:0.76rem;padding:0.2rem 0.5rem;" data-ev-jump-tab="organizers">All &rarr;</button>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:0.65rem;">
                    ${organizersList.slice(0, 2).map((o) => `
                      <div style="padding:0.75rem 0.9rem;border-radius:var(--ev-radius-sm);background:var(--ev-cream);border:1px solid var(--ev-border);">
                        <div style="font-weight:600;font-size:0.86rem;color:var(--ev-charcoal);">${esc(o.name)}</div>
                        <div style="font-size:0.76rem;color:var(--ev-primary);font-weight:600;">${esc(o.role)}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </aside>
          </div>
        </section>
      `;

      // Tab switching
      const tabBtns = document.querySelectorAll('[data-ev-tab]');
      const panels = document.querySelectorAll('.ev-tab-panel');
      function activateTab(tabId) {
        tabBtns.forEach((b) => b.classList.toggle('is-active', b.dataset.evTab === tabId));
        panels.forEach((p) => p.classList.toggle('is-active', p.id === `tab-${tabId}`));
      }
      tabBtns.forEach((b) => b.addEventListener('click', () => activateTab(b.dataset.evTab)));
      document.querySelectorAll('[data-ev-jump-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.evJumpTab;
          activateTab(target);
          document.getElementById('evDetailTabs').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      });

      function renderHeroRegCard() {
        const cardMount = document.getElementById('evHeroRegCardMount');
        if (!cardMount) return;
        const freshEv = EventoraStore.getEventBySlug(ev.slug) || ev;
        const curUser = window.EventoraAuth && typeof window.EventoraAuth.getSession === 'function' ? window.EventoraAuth.getSession() : null;
        const avail = EventoraStore.evaluateRegistrationAvailability(freshEv, curUser);
        const rc = freshEv.registrationConfig || {};

        let badgeText = freshEv.registrationStatus;
        let badgeCls = freshEv.registrationBadgeClass || 'ev-badge-open';
        let ctaHtml = '';
        let footNote = '';

        if (avail.state === 'already_registered' && avail.existingRegistration) {
          const st = avail.existingRegistration.registrationStatus;
          badgeText = st;
          badgeCls = st === 'Approved' ? 'ev-badge-open' : (st === 'Waitlisted' ? 'ev-badge-filling' : (st === 'Rejected' ? 'ev-badge-closed' : 'ev-badge-sample'));
          ctaHtml = `
            <a href="participant-dashboard.html?section=registrations&reg=${encodeURIComponent(avail.existingRegistration.registrationId)}" class="ev-btn ev-btn-forest" style="width:100%;" id="evHeroRegisterBtn">
              View My Registration &rarr;
            </a>
          `;
          footNote = `Pass ${esc(avail.existingRegistration.registrationId)} (${esc(st)})`;
        } else if (avail.state === 'waitlist_available') {
          badgeText = 'Waitlist Open';
          badgeCls = 'ev-badge-filling';
          ctaHtml = `
            <a href="register.html?slug=${encodeURIComponent(freshEv.slug)}" class="ev-btn ev-btn-forest" style="width:100%;" id="evHeroRegisterBtn">
              Join Waitlist &rarr;
            </a>
          `;
          footNote = 'Confirmed seats are full &bull; Join organizer waitlist';
        } else if (avail.state === 'closed' || avail.state === 'full' || avail.state === 'not_open_yet') {
          badgeText = avail.state === 'not_open_yet' ? 'Opens Soon' : 'Closed';
          badgeCls = avail.state === 'not_open_yet' ? 'ev-badge-sample' : 'ev-badge-closed';
          ctaHtml = `
            <button type="button" class="ev-btn ev-btn-outline" style="width:100%;opacity:0.65;cursor:not-allowed;" disabled id="evHeroRegisterBtn">
              ${avail.state === 'not_open_yet' ? 'Registration Not Open Yet' : 'Registration Closed'}
            </button>
          `;
          footNote = esc(avail.reason || 'Registration is unavailable.');
        } else {
          const btnText = avail.state === 'cancelled_can_reapply'
            ? 'Register Again'
            : (curUser ? 'Register Now' : 'Register Now (Sign In)');
          ctaHtml = `
            <a href="register.html?slug=${encodeURIComponent(freshEv.slug)}" class="ev-btn ev-btn-forest" style="width:100%;" id="evHeroRegisterBtn">
              ${esc(btnText)} &rarr;
            </a>
          `;
          const isDbReg = window.EventoraSync && window.EventoraSync.getStatus().mode === 'supabase';
          footNote = rc.approvalMode === 'manual'
            ? (isDbReg ? 'Requires organizer approval &bull; PostgreSQL backed' : 'Requires organizer approval &bull; Prototype local submission')
            : (isDbReg ? 'Automatic confirmation &bull; PostgreSQL backed' : 'Automatic confirmation &bull; Prototype local submission');
        }

        cardMount.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.65rem;">
            <span style="font-size:0.75rem;font-weight:700;color:var(--ev-muted);text-transform:uppercase;letter-spacing:0.07em;">Registration</span>
            <span class="ev-badge ${esc(badgeCls)}">${esc(badgeText)}</span>
          </div>
          <div style="font-family:var(--ev-font-display);font-size:1.22rem;font-weight:600;color:var(--ev-charcoal);">
            ${esc(freshEv.teamConfig.label)}
          </div>

          <div class="ev-reg-specs">
            <div class="ev-reg-spec-row">
              <span style="color:var(--ev-muted);">Participation Mode</span>
              <strong style="color:var(--ev-charcoal);">${esc(freshEv.mode)}</strong>
            </div>
            <div class="ev-reg-spec-row">
              <span style="color:var(--ev-muted);">Capacity</span>
              <strong style="color:var(--ev-charcoal);">${rc.capacityEnabled ? `${avail.seatsRemaining} of ${rc.maxRegistrations} left` : 'Unlimited'}</strong>
            </div>
            <div class="ev-reg-spec-row">
              <span style="color:var(--ev-muted);">Approval Policy</span>
              <strong style="color:var(--ev-charcoal);">${rc.approvalMode === 'manual' ? 'Organizer Approval' : 'Automatic'}</strong>
            </div>
          </div>

          ${ctaHtml}
          <p style="font-size:0.74rem;color:var(--ev-muted);text-align:center;margin-top:0.65rem;">
            ${footNote}
          </p>
        `;
      }

      renderHeroRegCard();
      window.addEventListener('eventora:authchange', renderHeroRegCard);
      EventoraMotion.initAll(document.getElementById('evEventHeroStage'));

      if (ev.dbId && window.EventoraRealtime && window.EventoraSync && window.EventoraSync.getStatus().mode === 'supabase') {
        window.EventoraRealtime.subscribeEventWorkspace({
          scopeKey: `public-event-${ev.dbId}`,
          eventId: ev.dbId,
          includeOrganizerTables: false,
          onChange: async () => {
            const u = window.EventoraAuth && window.EventoraAuth.getSession ? window.EventoraAuth.getSession() : null;
            await window.EventoraSync.hydrateEventBySlug(ev.slug, u, { organizerView: false });
            renderHeroRegCard();
            window.EventoraRealtime.notifyImportantChange('Event details or live standings updated.');
          }
        });
      }
    })();
  </script>
</body>
</html>
