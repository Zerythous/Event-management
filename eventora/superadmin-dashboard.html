<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Console — Eventora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/design-system.css" />
  <link rel="stylesheet" href="styles/motion-3d.css" />
</head>
<body>
  <div id="evSuperAdminRoot"></div>
  <div id="evModalsMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/events-store.js"></script>
  <script src="scripts/supabase-client.js"></script>
  <script src="scripts/profiles-api.js"></script>
  <script src="scripts/events-api.js"></script>
  <script src="scripts/realtime-sync.js"></script>
  <script src="scripts/supabase-sync.js"></script>
  <script src="scripts/auth-store.js"></script>
  <script src="scripts/role-access.js"></script>
  <script src="scripts/motion-3d.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/workspace-ui.js"></script>
  <script>
    (function initSuperAdminDashboard() {
      const rootEl = document.getElementById('evSuperAdminRoot');
      const modalsMount = document.getElementById('evModalsMount');

      if (modalsMount && !modalsMount.innerHTML.trim()) {
        EventoraUI.mountShell('superadmin');
        const navM = document.getElementById('evNavMount');
        const footM = document.getElementById('evFooterMount');
        if (navM) navM.innerHTML = '';
        if (footM) footM.innerHTML = '';
      }

      const params = new URLSearchParams(window.location.search);
      const validSections = new Set(['overview', 'security', 'governance']);
      let activeSection = validSections.has(params.get('section')) ? params.get('section') : 'overview';
      let shellCtrl = null;

      const NAV_GROUPS = [
        {
          title: 'System Authority',
          items: [
            { id: 'overview', label: 'System Overview', icon: 'overview' },
            { id: 'security', label: 'RLS & Triggers', icon: 'settings' },
            { id: 'governance', label: 'Admin Roles', icon: 'collaborators' }
          ]
        }
      ];

      const SECTION_TITLES = {
        overview: 'Super Admin Console',
        security: 'Security & Policy Architecture',
        governance: 'Platform Role Governance'
      };

      function renderSectionContent(user) {
        if (!shellCtrl || !shellCtrl.bodyMount || !user) return;
        const esc = EventoraUI.escapeHTML;

        if (activeSection === 'overview') {
          shellCtrl.bodyMount.innerHTML = `
            <div class="ev-auth-status is-info" style="margin-bottom:1.35rem;" role="note">
              <span style="flex-shrink:0;display:inline-flex;margin-top:2px;">${EventoraUI.icon('alert')}</span>
              <span><strong>Super Admin Boundary Active:</strong> Reserved exclusively for verified <code>super_admin</code> accounts. Platform-wide role mutations and audit logs require server-side Postgres RPC execution in the database integration phase.</span>
            </div>

            <div class="ev-stat-grid">
              <div class="ev-stat-card">
                <div class="ev-stat-label">Verified Authority</div>
                <div class="ev-stat-value" style="font-size:1.25rem;padding-top:0.35rem;">Super Admin</div>
                <div class="ev-stat-sub">${esc(user.email)}</div>
              </div>
              <div class="ev-stat-card">
                <div class="ev-stat-label">Workspace Separation</div>
                <div class="ev-stat-value">5 Roles</div>
                <div class="ev-stat-sub">Dedicated route boundaries enforced</div>
              </div>
              <div class="ev-stat-card">
                <div class="ev-stat-label">Backend RPCs</div>
                <div class="ev-stat-value" style="font-size:1.25rem;padding-top:0.35rem;">Phase 3+</div>
                <div class="ev-stat-sub">No live SQL executed in Phase 2.2</div>
              </div>
            </div>

            <div class="ev-ws-card">
              <div class="ev-ws-card-head">
                <div>
                  <h2 class="ev-display" style="font-size:1.25rem;font-weight:600;">System Governance Console</h2>
                  <p style="font-size:0.82rem;color:var(--ev-muted);">Manage platform-level policies safely isolated from Organizer Event Studio and Participant workspaces.</p>
                </div>
                <a href="admin-dashboard.html" class="ev-btn ev-btn-outline ev-btn-sm">Open Admin Console &rarr;</a>
              </div>
              <div style="display:flex;gap:0.65rem;flex-wrap:wrap;">
                <button type="button" class="ev-btn ev-btn-forest ev-btn-sm" data-jump-section="security">Inspect RLS Readiness</button>
                <button type="button" class="ev-btn ev-btn-outline ev-btn-sm" data-jump-section="governance">Admin Assignment Policy</button>
              </div>
            </div>
          `;
        } else if (activeSection === 'security') {
          shellCtrl.bodyMount.innerHTML = `
            <div class="ev-ws-card">
              <span class="ev-badge ev-badge-open" style="margin-bottom:0.45rem;">Architecture Readiness</span>
              <h2 class="ev-display" style="font-size:1.3rem;font-weight:600;margin-bottom:0.45rem;">Backend RLS &amp; Security Separation</h2>
              <p style="font-size:0.86rem;color:var(--ev-muted);line-height:1.6;">
                Frontend routing and capability helpers never constitute security enforcement on their own. Full database protection relies on the Phase 1B Postgres migration architecture (<code>public.is_super_admin()</code>, <code>enforce_profile_role_security()</code>, and strict table RLS policies) when enabled in Supabase.
              </p>
            </div>
          `;
        } else {
          shellCtrl.bodyMount.innerHTML = `
            <div class="ev-ws-card">
              <span class="ev-badge ev-badge-sample" style="margin-bottom:0.45rem;">Server Action Required</span>
              <h2 class="ev-display" style="font-size:1.3rem;font-weight:600;margin-bottom:0.45rem;">Elevated Role Governance</h2>
              <p style="font-size:0.86rem;color:var(--ev-muted);line-height:1.6;">
                Assigning or revoking <code>organizer</code>, <code>manager</code>, <code>admin</code>, or <code>super_admin</code> roles is blocked from all client forms and executes solely via Supabase server Admin APIs or verified SQL functions.
              </p>
            </div>
          `;
        }

        document.querySelectorAll('[data-jump-section]').forEach((btn) => {
          btn.addEventListener('click', () => switchSection(btn.dataset.jumpSection));
        });
      }

      function switchSection(nextSection) {
        if (!validSections.has(nextSection)) return;
        activeSection = nextSection;
        const user = EventoraAuth.getSession();
        if (shellCtrl) shellCtrl.setActiveNav(activeSection, SECTION_TITLES[activeSection] || 'Super Admin Console');
        renderSectionContent(user);
      }

      function mountPage() {
        const access = EventoraAccess.evaluatePageAccess({
          requiredRoles: ['super_admin'],
          rootEl,
          pageName: 'Super Admin Console'
        });
        if (!access.allowed) return;

        shellCtrl = EventoraWorkspace.renderWorkspaceShell({
          rootEl,
          user: access.user,
          navGroups: NAV_GROUPS,
          activeSection,
          topTitle: SECTION_TITLES[activeSection] || 'Super Admin Console',
          onSelectSection: switchSection,
          onSearchSubmit: () => switchSection('overview'),
          onLogout: async () => {
            await EventoraAuth.signOut();
            window.location.href = 'login.html';
          }
        });
        renderSectionContent(access.user);
      }

      window.addEventListener('eventora:authchange', mountPage);
      mountPage();
      EventoraAuth.ready().then(mountPage);
    })();
  </script>
</body>
</html>
